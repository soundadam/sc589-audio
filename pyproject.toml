[project]
name = "sc589-audio"
version = "0"
description = "Mac-side analysis for the SC589 audio firmware and the DSP lab reports"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["host/dsplab"]
